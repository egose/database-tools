name: Release

on:
  push:
    tags:
    - v*.*.*

concurrency:
  group: release-publication
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      attestations: write
      id-token: write

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        fetch-tags: true

    - name: Report release SHA
      run: |
        set -euo pipefail
        checkout_sha="$(git rev-parse HEAD)"
        event_commit_sha="$(git rev-parse "$GITHUB_SHA^{commit}")"
        tag_target_sha="$(git rev-list -n 1 "$GITHUB_REF_NAME")"
        printf 'GitHub event SHA: %s\n' "$GITHUB_SHA"
        printf 'GitHub event commit SHA: %s\n' "$event_commit_sha"
        printf 'Checked out SHA: %s\n' "$checkout_sha"
        printf 'Tag target SHA: %s\n' "$tag_target_sha"
        {
          printf "### Release checkout evidence\n"
          printf -- "- GitHub event SHA: \`%s\`\n" "$GITHUB_SHA"
          printf -- "- GitHub event commit SHA: \`%s\`\n" "$event_commit_sha"
          printf -- "- Checked out SHA: \`%s\`\n" "$checkout_sha"
          printf -- "- Tag target SHA: \`%s\`\n" "$tag_target_sha"
        } >> "$GITHUB_STEP_SUMMARY"
        if [ "$checkout_sha" != "$event_commit_sha" ]; then
          printf 'Checked out SHA %s does not match GitHub event commit SHA %s\n' "$checkout_sha" "$event_commit_sha" >&2
          exit 1
        fi
        if [ "$tag_target_sha" != "$event_commit_sha" ]; then
          printf 'Tag target SHA %s does not match GitHub event commit SHA %s\n' "$tag_target_sha" "$event_commit_sha" >&2
          exit 1
        fi

    - name: Setup Tools
      uses: ./.github/actions/setup-tools

    - name: Validate release tag
      run: bash scripts/validate-release-tag.sh "$RELEASE_TAG"
      env:
        RELEASE_TAG: ${{ github.ref_name }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e

    - name: Verify tagged release candidate
      run: make release-verify VERSION="$RELEASE_TAG"
      env:
        RELEASE_TAG: ${{ github.ref_name }}

    - name: Generate SBOM
      run: |
        docker run --rm \
          -v "$PWD:/workspace" \
          anchore/syft:v1.38.0@sha256:825cad3a952c87676a6d07e9a3bb05ac9c401d598360070e970aa46d54c1727e \
          dir:/workspace/dist \
          -o "spdx-json=/workspace/dist/database-tools-${RELEASE_TAG}-sbom.spdx.json"
      env:
        RELEASE_TAG: ${{ github.ref_name }}

    - name: Attest release artifacts
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
      with:
        subject-path: |
          dist/*.tar.gz
          dist/*.txt
          dist/*.spdx.json

    - name: Upload release artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: release-artifacts-${{ github.ref_name }}
        path: |
          dist/*.tar.gz
          dist/*.txt
          dist/*.spdx.json

  integration:
    uses: ./.github/workflows/integration.yml
    permissions:
      contents: read
    with:
      ref: ${{ github.sha }}

  release:
    needs:
    - verify
    - integration
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
    - name: Download verified release artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: release-artifacts-${{ github.ref_name }}
        path: dist

    - name: Release
      uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
      with:
        generate_release_notes: true
        files: |
          dist/*.tar.gz
          dist/*.txt
          dist/*.spdx.json

  publish-image:
    needs:
    - verify
    - integration
    uses: ./.github/workflows/publish.yaml
    with:
      ref: ${{ github.sha }}
      tag_name: ${{ github.ref_name }}
    secrets: inherit # pragma: allowlist secret
