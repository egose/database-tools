name: Publish Docker image

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      tag_name:
        required: true
        type: string

env:
  DOCKER_REGISTRY: ghcr.io
  IMAGE_NAME: egose/database-tools

jobs:
  build-push:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      security-events: write
      attestations: write
      id-token: write

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ inputs.ref }}

    - name: Derive image version
      id: version
      run: printf 'value=%s\n' "${TAG_NAME#v}" >> "$GITHUB_OUTPUT"
      env:
        TAG_NAME: ${{ inputs.tag_name }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ${{ env.DOCKER_REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract image metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=raw,value=${{ steps.version.outputs.value }}
          type=semver,pattern={{version}},value=${{ inputs.tag_name }}
          type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag_name }}
          type=semver,pattern={{major}},value=${{ inputs.tag_name }}

    - name: Build and push image
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        sbom: true
        provenance: mode=max
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}

    - name: Scan published image
      uses: aquasecurity/trivy-action@0.31.0
      with:
        image-ref: ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.value }}
        format: sarif
        output: trivy-results.sarif
        exit-code: 1
        ignore-unfixed: true
        severity: HIGH,CRITICAL

    - name: Upload image scan results
      if: always()
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: trivy-results.sarif
