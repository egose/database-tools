name: Integration verification

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string

permissions:
  contents: read

jobs:
  integration-bats:
    name: integration-bats (clean start ${{ matrix.startup-attempt }}/5)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        startup-attempt: [1, 2, 3, 4, 5]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ inputs.ref }}

    - name: Report checkout SHA
      run: |
        set -euo pipefail
        checkout_sha="$(git rev-parse HEAD)"
        printf 'Requested ref: %s\n' "$REQUESTED_REF"
        printf 'Checked out SHA: %s\n' "$checkout_sha"
        {
          printf "### Integration checkout evidence\n"
          printf -- "- Requested ref: \`%s\`\n" "$REQUESTED_REF"
          printf -- "- Checked out SHA: \`%s\`\n" "$checkout_sha"
        } >> "$GITHUB_STEP_SUMMARY"
        if [[ "$REQUESTED_REF" =~ ^[0-9a-f]{40}$ ]] && [ "$checkout_sha" != "$REQUESTED_REF" ]; then
          printf 'Checked out SHA %s does not match requested SHA %s\n' "$checkout_sha" "$REQUESTED_REF" >&2
          exit 1
        fi
      env:
        REQUESTED_REF: ${{ inputs.ref }}

    - name: Setup Tools
      uses: ./.github/actions/setup-tools

    - name: Setup NPM Packages
      uses: ./.github/actions/setup-npm

    - name: Install PostgreSQL client
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install --yes --no-install-recommends postgresql-client-16
        pg_dump --version
        pg_restore --version
        psql --version

    - name: Prepare env file for Bats and compose
      run: cp .env.example .env.test

    - name: Run integration sandbox
      id: sandbox
      uses: egose/actions/compose-sandbox@6f27cb186bb9b8455c813722933b01706eaf6141
      with:
        config: sandbox/compose-sandbox.mjs
        artifact-name: integration-service-logs-${{ matrix.startup-attempt }}
        artifact-policy: always

    - name: Ensure bind-mount cleanup
      if: always()
      run: sudo rm -rf ./sandbox/mnt || true
