name: Test codebase

on:
  push:
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-test-cover:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

    - name: Setup Tools
      uses: ./.github/actions/setup-tools

    - name: Run go test with coverage
      run: go test -shuffle=on -coverprofile=coverage.out ./...

    - name: Enforce coverage floor
      run: |
        total=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub(/%/, "", $3); print $3}')
        # Current total coverage is about 59.6%; keep a small tolerance for toolchain-only drift.
        minimum=55.0
        printf 'total coverage: %s%%\n' "$total"
        awk -v total="$total" -v minimum="$minimum" 'BEGIN { if (total + 0 < minimum + 0) { exit 1 } }'

    - name: Enforce storage coverage floor
      run: |
        go test -shuffle=on -coverprofile=storage-coverage.out ./storage
        storage=$(go tool cover -func=storage-coverage.out | awk '/^total:/ {gsub(/%/, "", $3); print $3}')
        # Current storage coverage is about 55.2%; this protects the provider contract suite.
        minimum=50.0
        printf 'storage coverage: %s%%\n' "$storage"
        awk -v total="$storage" -v minimum="$minimum" 'BEGIN { if (total + 0 < minimum + 0) { exit 1 } }'

    - name: Upload coverage artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: coverage.out
        path: coverage.out

  go-test-race:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

    - name: Setup Tools
      uses: ./.github/actions/setup-tools

    - name: Run go test with race detector
      run: go test -race -shuffle=on ./...

  go-vet:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

    - name: Setup Tools
      uses: ./.github/actions/setup-tools

    - name: Run go vet
      run: go vet ./...

  integration-bats:
    uses: ./.github/workflows/integration.yml
    with:
      ref: ${{ github.sha }}
