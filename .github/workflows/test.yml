name: Test codebase

on: push

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

    - name: Setup Tools
      uses: ./.github/actions/setup-tools

    - name: Setup NPM Packages
      uses: ./.github/actions/setup-npm

    - name: Run test
      run: |
        mkdir -p ./sandbox/mnt/mongodb
        mkdir -p ./sandbox/mnt/minio
        mkdir -p ./sandbox/mnt/azurite
        mkdir -p ./sandbox/mnt/fake-gcs-server

        cp .env.example .env.test

        export MACHINE_HOST_IP=$(hostname -I | awk '{print $1}')
        docker-compose --env-file .env.test -f sandbox/docker-compose.yml -f sandbox/docker-compose-ci.yml up -d
        node_modules/.bin/wait-on tcp::27017 --timeout 120000
        node_modules/.bin/wait-on http://localhost:9001 --timeout 120000

        bats test

        docker-compose --env-file .env.test -f sandbox/docker-compose.yml -f sandbox/docker-compose-ci.yml down
        sudo rm -rf ./sandbox/mnt
