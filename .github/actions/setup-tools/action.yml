name: Setup Tools
description: Setup required tools in the workspace

runs:
  using: composite
  steps:
  - name: Install asdf
    uses: egose/actions/asdf-install@7e353763093d79b6a02c447f8c1393ffad13ded1

  - name: Cache tools
    uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
    with:
      path: ~/.asdf
      key: asdf-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.tool-versions', '.github/actions/setup-tools/action.yml', 'scripts/setup-asdf-tools.sh', 'requirements.txt', 'requirements-lock.txt') }}
      restore-keys: |
        asdf-${{ runner.os }}-${{ runner.arch }}-

  - name: Cache Go builds
    uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
    with:
      path: ~/.cache/go-build
      key: go-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('.tool-versions', 'go.sum') }}
      restore-keys: |
        go-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
        go-${{ runner.os }}-${{ runner.arch }}-

  - name: Install pinned asdf tools
    run: bash scripts/setup-asdf-tools.sh
    shell: bash

  - name: Install python tools
    run: bash scripts/install-python-tools.sh
    shell: bash
