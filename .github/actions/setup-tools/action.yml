name: Setup Tools
description: Setup required tools in the workspace

runs:
  using: composite
  steps:
  - name: Setup Tools
    uses: egose/actions/asdf-tools@4a6a7482207c0ba30b3b6487cccef3491bde6e7c
    with:
      plugins: |
        mongodb=https://github.com/junminahn/asdf-mongodb.git
        docker-compose=https://github.com/egose/asdf-docker-compose.git

  - name: Install python tools
    run: |
      pip install -r requirements.txt
      asdf reshim
    shell: bash
