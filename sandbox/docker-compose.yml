services:
  postgres:
    container_name: database-tools-postgres
    # See https://hub.docker.com/_/postgres/tags
    image: postgres:16.10-bookworm@sha256:38471f330eb885e04de130b768d6db4e10469e2311879c7e5c699f6d2d8a1c74
    environment:
      POSTGRES_DB: integration
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres # pragma: allowlist secret
    ports:
    - 127.0.0.1:${POSTGRES_PORT:-5432}:5432
    volumes:
    - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres -d integration -t 5]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  mongodb:
    platform: linux/amd64
    container_name: database-tools-mongodb
    # See https://hub.docker.com/r/bitnami/mongodb/tags
    image: ghcr.io/egose/bitnami-mongodb:8.2.7@sha256:2683244a60e66970271aee7fe509354f60c1a7e1dfbcaf8e025fc5e2c4b1bb27
    environment:
    - MONGODB_ADVERTISED_HOSTNAME=127.0.0.1
    - MONGODB_REPLICA_SET_MODE=primary
    - MONGODB_ROOT_USER=mongodb
    - MONGODB_ROOT_PASSWORD=mongodb
    - MONGODB_REPLICA_SET_KEY=replicasetkey123
    ports:
    - 127.0.0.1:27017:27017
    volumes:
    - mongodb_data:/data/db

  minio:
    platform: linux/amd64
    container_name: database-tools-minio
    image: minio/minio:RELEASE.2025-02-07T23-21-09Z@sha256:640c22768ed5dbc92eacc14502a1b06a1c708fa60431345c78dfc22917062e93
    ports:
    - 127.0.0.1:9000:9000
    - 127.0.0.1:9001:9001
    volumes:
    - minio_data:/data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin # pragma: allowlist secret
    command: server --console-address ":9001" /data

  minio-init:
    platform: linux/amd64
    # See https://hub.docker.com/r/minio/mc/tags
    image: minio/mc:RELEASE.2025-02-08T19-14-21Z@sha256:5e8d8a62846797a34d1aaaafe9d9bebe75ac71229063383eadc497bd0e3f6317
    environment:
      MINIO_BUCKET: ${MINIO_BUCKET}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
    entrypoint:
    - /bin/sh
    - -c
    - |
      set -eu
      until /usr/bin/mc alias set minio http://minio:9000 minioadmin minioadmin; do sleep 1; done
      until /usr/bin/mc ready minio; do sleep 1; done
      /usr/bin/mc rb --force "minio/$${MINIO_BUCKET}" || true
      /usr/bin/mc mb "minio/$${MINIO_BUCKET}"
      /usr/bin/mc anonymous set download "minio/$${MINIO_BUCKET}"
      svcacct_output=$$(/usr/bin/mc admin user svcacct add minio minioadmin --access-key "$${MINIO_ACCESS_KEY}" --secret-key "$${MINIO_SECRET_KEY}" 2>&1) || svcacct_status=$$?
      if [ "$${svcacct_status:-0}" -ne 0 ]; then
        case "$$svcacct_output" in
          *[Aa]lready*exists*|*[Aa]lready*taken*) printf '%s\n' "$$svcacct_output" ;;
          *) printf '%s\n' "$$svcacct_output" >&2; exit "$$svcacct_status" ;;
        esac
      else
        printf '%s\n' "$$svcacct_output"
      fi
    depends_on:
    - minio

  azurite:
    platform: linux/amd64
    container_name: database-tools-azurite
    # See https://github.com/Azure/Azurite/tags
    image: mcr.microsoft.com/azure-storage/azurite:3.36.0@sha256:76b8127d608fab8287a14a4bfeb9a5502cdcffb4bf1e86f09f324ebb0e70edba
    restart: always
    environment:
      AZURITE_ACCOUNTS: ${AZURITE_ACCOUNT_NAME}:${AZURITE_ACCOUNT_KEY}
    ports:
    - 127.0.0.1:10000:10000
    - 127.0.0.1:10001:10001
    volumes:
    - azurite_data:/home/host
    command: azurite --blobHost 0.0.0.0 --blobPort 10000 --location /home/host --debug /home/host/azure.log --skipApiVersionCheck

  # See https://github.com/fsouza/fake-gcs-server
  # See https://hub.docker.com/r/fsouza/fake-gcs-server/tags
  fake-gcs-server:
    platform: linux/amd64
    container_name: database-tools-fake-gcs-server
    image: fsouza/fake-gcs-server:1.55.1@sha256:91afded49de804aa61b5f3eb6c7cd65205acf9e5c5e047cf0ba7d9507af806c8
    restart: always
    ports:
    - 127.0.0.1:${FAKE_GCP_PORT}:${FAKE_GCP_PORT}
    environment:
      FAKE_GCP_BUCKET: ${FAKE_GCP_BUCKET}
      FAKE_GCP_PORT: ${FAKE_GCP_PORT}
    volumes:
    - fake_gcs_data:/data
    entrypoint:
    - /bin/sh
    - -c
    - |
      mkdir -p "/data/$${FAKE_GCP_BUCKET}"
      exec /bin/fake-gcs-server -data /data -scheme http -port "$${FAKE_GCP_PORT}" -public-host "localhost:$${FAKE_GCP_PORT}"

volumes:
  postgres_data:
  mongodb_data:
  minio_data:
  azurite_data:
  fake_gcs_data:
