services:
  postgres:
    container_name: database-tools-postgres
    # See https://hub.docker.com/_/postgres/tags
    image: postgres:16.10-bookworm@sha256:38471f330eb885e04de130b768d6db4e10469e2311879c7e5c699f6d2d8a1c74
    environment:
      POSTGRES_DB: integration
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres # pragma: allowlist secret
    ports:
    - 127.0.0.1:${POSTGRES_PORT:-5432}:5432
    volumes:
    - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres -d integration -t 5]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  mongodb:
    platform: linux/amd64
    container_name: database-tools-mongodb
    # See https://hub.docker.com/r/bitnami/mongodb/tags
    image: ghcr.io/egose/bitnami-mongodb:8.2.7@sha256:2683244a60e66970271aee7fe509354f60c1a7e1dfbcaf8e025fc5e2c4b1bb27
    environment:
    - MONGODB_ADVERTISED_HOSTNAME=127.0.0.1
    - MONGODB_REPLICA_SET_MODE=primary
    - MONGODB_ROOT_USER=mongodb
    - MONGODB_ROOT_PASSWORD=mongodb
    - MONGODB_REPLICA_SET_KEY=replicasetkey123
    ports:
    - 127.0.0.1:27017:27017
    volumes:
    - mongodb_data:/data/db

  seaweedfs:
    platform: linux/amd64
    container_name: database-tools-seaweedfs
    # See https://hub.docker.com/r/chrislusf/seaweedfs/tags
    # See https://github.com/seaweedfs/seaweedfs/releases
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    ports:
    - 127.0.0.1:9000:8333
    volumes:
    - seaweedfs_data:/data
    - ./seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro
    command: server -dir /data -filer -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -s3.autoCreateBucket=false

  seaweedfs-init:
    platform: linux/amd64
    # See https://hub.docker.com/r/amazon/aws-cli/tags
    image: amazon/aws-cli:2.38.1@sha256:733d5be1015825e4038c6016f3fa9954868ddee1f611b73be795a9cc2e706bfd
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY}
      AWS_DEFAULT_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: 'true'
      MINIO_BUCKET: ${MINIO_BUCKET}
    entrypoint:
    - /bin/sh
    - -c
    - |
      set -eu
      endpoint="http://seaweedfs:8333"
      i=0
      until /usr/local/bin/aws --endpoint-url "$$endpoint" s3api head-bucket --bucket "$MINIO_BUCKET" 2>/dev/null; do
        i=$$((i + 1))
        if [ "$$i" -gt 110 ]; then
          echo "seaweedfs bucket \"$MINIO_BUCKET\" did not become available" >&2
          exit 1
        fi
        /usr/local/bin/aws --endpoint-url "$$endpoint" s3 mb "s3://$MINIO_BUCKET" 2>/dev/null || true
        sleep 1
      done
    depends_on:
    - seaweedfs

  azurite:
    platform: linux/amd64
    container_name: database-tools-azurite
    # See https://github.com/Azure/Azurite/tags
    image: mcr.microsoft.com/azure-storage/azurite:3.36.0@sha256:76b8127d608fab8287a14a4bfeb9a5502cdcffb4bf1e86f09f324ebb0e70edba
    restart: always
    environment:
      AZURITE_ACCOUNTS: ${AZURITE_ACCOUNT_NAME}:${AZURITE_ACCOUNT_KEY}
    ports:
    - 127.0.0.1:10000:10000
    - 127.0.0.1:10001:10001
    volumes:
    - azurite_data:/home/host
    command: azurite --blobHost 0.0.0.0 --blobPort 10000 --location /home/host --debug /home/host/azure.log --skipApiVersionCheck

  # See https://github.com/fsouza/fake-gcs-server
  # See https://hub.docker.com/r/fsouza/fake-gcs-server/tags
  fake-gcs-server:
    platform: linux/amd64
    container_name: database-tools-fake-gcs-server
    image: fsouza/fake-gcs-server:1.55.1@sha256:91afded49de804aa61b5f3eb6c7cd65205acf9e5c5e047cf0ba7d9507af806c8
    restart: always
    ports:
    - 127.0.0.1:${FAKE_GCP_PORT}:${FAKE_GCP_PORT}
    environment:
      FAKE_GCP_BUCKET: ${FAKE_GCP_BUCKET}
      FAKE_GCP_PORT: ${FAKE_GCP_PORT}
    volumes:
    - fake_gcs_data:/data
    entrypoint:
    - /bin/sh
    - -c
    - |
      mkdir -p "/data/$${FAKE_GCP_BUCKET}"
      exec /bin/fake-gcs-server -data /data -scheme http -port "$${FAKE_GCP_PORT}" -public-host "localhost:$${FAKE_GCP_PORT}"

volumes:
  postgres_data:
  mongodb_data:
  seaweedfs_data:
  azurite_data:
  fake_gcs_data:
