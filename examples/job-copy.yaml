apiVersion: batch/v1
kind: Job
metadata:
  name: mongo-copy
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: backup-job
        image: ghcr.io/egose/database-tools:<latest-version>
        imagePullPolicy: IfNotPresent
        command: [/bin/sh, -c]
        args:
        - |
          set -eu
          backup_path="${MONGO_COPY_WORKDIR:-/tmp/backup}"
          mkdir -p "${backup_path}"
          mongo-archive --db=olddb --force-table-scan
          set -- "${backup_path}"/mongo-archive/*.tar.gz
          if [ "$#" -ne 1 ] || [ ! -f "$1" ]; then
            printf '%s\n' 'expected exactly one new archive object' >&2
            exit 1
          fi
          archive_object="${1#${backup_path}/}"
          mongo-unarchive --db=newdb --dir=olddb --object-name="${archive_object}"
        env:
        - name: MONGOARCHIVE__URI
          valueFrom:
            secretKeyRef:
              name: mongo-copy-secrets
              key: archive-uri
        - name: MONGOUNARCHIVE__URI
          valueFrom:
            secretKeyRef:
              name: mongo-copy-secrets
              key: restore-uri
        - name: MONGOARCHIVE__LOCAL_PATH
          value: /tmp/backup
        - name: MONGOUNARCHIVE__LOCAL_PATH
          value: /tmp/backup
